# Publishes the built package to the `carlos-dist` branch.
#
# nuxt-studio ships only `dist/` on npm, and this fork is not published there —
# the site installs it straight from git. Yarn 1 runs a git dependency's
# `prepare` script but not its `prepack`, and building this package needs its
# full dev dependencies, which is far too much to do inside the site's Docker
# build (8 GB host, no swap, two Nuxt images already built sequentially).
#
# So the artifact is built here instead: `carlos-dist` is `carlos` plus one
# commit carrying `dist/`. The site pins a commit of that branch in yarn.lock.
name: carlos-dist

on:
  push:
    branches: [carlos]
  workflow_dispatch:

concurrency:
  group: carlos-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Stamp a unique version onto this build. The module bakes `version` from
      # package.json into the Studio app's asset URL (`/_studio-app/<version>/
      # main.js`), which is served `immutable` for a year. Left at a constant
      # `1.7.0-carlos.1` every rebuild overwrites that one URL and no browser
      # that already loaded the editor ever fetches the new bundle. The run
      # number is monotonic and always a clean integer (valid semver prerelease).
      - name: Stamp build version
        run: |
          set -eu
          VERSION="1.7.0-carlos.${{ github.run_number }}"
          npm pkg set version="$VERSION"
          echo "STUDIO_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "::notice::carlos-dist build version $VERSION"

      # Both of these have to happen before anything else runs. The app's tests
      # import the module through `src/module/dist/runtime/**`, which only the
      # stub build writes; and `prepack`'s module half reads
      # `src/module/.nuxt/tsconfig.json`, which only this prepare step writes.
      # This is `dev:prepare` minus the playground and docs, which nothing here
      # needs.
      - run: pnpm exec nuxt-module-build build --stub src/module
      - run: pnpm exec nuxt-module-build prepare src/module

      - run: pnpm run lint

      - run: pnpm run test

      # `nuxt-module-build build src/module; vite build src/app` — joined with a
      # `;`, so the script exits on the *second* command's status and a failure
      # of the module half goes unreported. Hence the check below.
      - run: pnpm run prepack

      # Hence an explicit check: `prepack` cannot be trusted to report a failure
      # of its first half, and a dist missing the module is a package that
      # installs fine and does nothing.
      - name: Verify build output
        run: |
          set -eu
          for f in dist/module/module.mjs dist/app/main.js; do
            test -s "$f" || { echo "::error::missing or empty $f"; exit 1; }
          done
          test -s dist/module/runtime/server/routes/medias-move.post.js \
            || { echo "::error::medias-move route missing from dist"; exit 1; }
          # Fingerprint the built app bundle so the publish step can prove it is
          # committing *this* build and not one carried over by the branch dance.
          sha256sum dist/app/main.js dist/module/module.mjs > "$RUNNER_TEMP/dist.sha256"

      # The branch is only ever appended to, never rewritten. A consumer pins a
      # commit of it in its lockfile, and a force-push would orphan exactly that
      # commit — an install that worked yesterday would then fail to fetch it.
      - name: Publish carlos-dist
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The freshly built `dist` has to leave the work tree *before* any
          # branch switch. It is gitignored on `carlos` but tracked on
          # `carlos-dist`, and `git checkout` overwrites an ignored file that
          # collides with a tracked one in the target branch (it protects only
          # untracked-and-not-ignored files) — so checking out `carlos-dist`
          # here was silently replacing this build with the previous one.
          rm -rf "$RUNNER_TEMP/dist"
          mv dist "$RUNNER_TEMP/dist"

          if git ls-remote --exit-code --heads origin carlos-dist >/dev/null 2>&1; then
            git fetch --no-tags origin carlos-dist
            git checkout -B carlos-dist origin/carlos-dist
          else
            git checkout -B carlos-dist "$GITHUB_SHA"
          fi

          # Keep the branch's history, but make its *content* this build's
          # source plus the dist just built.
          git read-tree -u --reset "$GITHUB_SHA"
          rm -rf dist
          mv "$RUNNER_TEMP/dist" dist

          # The reset above restored package.json's stock version; re-stamp it so
          # the committed source agrees with the version baked into dist/.
          npm pkg set version="$STUDIO_BUILD_VERSION"

          # The dist about to be committed must be byte-for-byte the one the
          # build produced. A mismatch means a checkout or reset overwrote it.
          sha256sum -c "$RUNNER_TEMP/dist.sha256" \
            || { echo "::error::dist was overwritten between build and publish"; exit 1; }

          # `dist` is gitignored for development, hence the force.
          git add -f dist
          git add package.json
          git commit -m "build: dist for ${GITHUB_SHA} (${STUDIO_BUILD_VERSION})"
          git push origin carlos-dist
